name: ChristmasTown
options:
  bundleIdPrefix: com.lexi
  deploymentTarget:
    iOS: "17.0"
targets:
  ChristmasTown:
    type: application
    platform: iOS
    sources:
      - path: ChristmasTown
    info:
      path: ChristmasTown/Info.plist
      properties:
        CFBundleDisplayName: Christmas Town
        UILaunchScreen: {}
        UIAppFonts: [PixelifySans.ttf]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        UIStatusBarHidden: true
        CFBundleShortVersionString: "0.7"
        CFBundleVersion: "7"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lexi.christmastown
        DEVELOPMENT_TEAM: VVA5W6L57V
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
